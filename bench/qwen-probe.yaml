# Single-match cost probe for qwen/qwen3-235b-a22b-2507
# Goal: measure real $/match before committing to 2-match chunk.
# Expected: ~$0.03-0.10 per match.

bench_run_id: qwen-probe-v1
runs_dir: referee-engine/runs/v1
budget_cap_usd: 0.30
concurrency: 1

defaults:
  llm:
    provider: openai-completions
    baseUrl: https://openrouter.ai/api/v1
    proxy: ""
  match:
    duration: 360
    phases:
      defense: 180
      attack: 180
  scoring:
    attackSuccess: 10
    defenseFailure: -10
    slaViolation: -5
  flags:
    refreshInterval: 300
    format: "FLAG{{{hash}}}"
  token_budget_input: 400000
  token_budget_output: 30000

scenarios:
  S1:
    target_image: openclaw/ctf-target:v1
    oracle_image: openclaw/oracle-s1:v1
    flag_slot_count: 4

models:
  - id: qwen_a22b_paid
    openrouter_slug: qwen/qwen3-235b-a22b-2507
    label: Qwen3-235B-A22B (paid)

phases:
  - name: probe
    description: Single Qwen3-235B-A22B def-only probe
    grid:
      models: [qwen_a22b_paid]
      scenarios: [S1]
      modes: [defense_only]
      k: 1
