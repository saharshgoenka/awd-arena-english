# Phase A stage 1 — k=1 (4 matches) to checkpoint cost.
#
# 2026-05-21 budget reality: cost probe measured $0.034 for a 3-min DeepSeek
# def-only match. Extrapolated 8 matches @ 5+5min ≈ $0.50. Only $0.96 remains
# on the OpenRouter key. Splitting into two stages so I can confirm cost
# before committing the full $0.50.
#
# Stage 1: k=1 → 4 matches. Expected spend ~$0.20-0.25.
# Stage 2 (separate yaml v1-stage2.yaml, run only if stage 1 cost stayed
# within estimate): k=1 again, same grid, populating k=2 across both stages.

bench_run_id: v1-phaseA-stage1
runs_dir: referee-engine/runs/v1
budget_cap_usd: 0.50          # tighter than the global $5 cap
concurrency: 1

defaults:
  llm:
    provider: openai-completions
    baseUrl: https://openrouter.ai/api/v1
    proxy: ""
  match:
    duration: 360                 # 3min defense + 3min attack (was 5+5)
    phases:
      defense: 180                # 3 min — matches cost-probe baseline
      attack: 180                 # 3 min
  scoring:
    attackSuccess: 10
    defenseFailure: -10
    slaViolation: -5
  flags:
    refreshInterval: 300
    format: "FLAG{{{hash}}}"
  token_budget_input: 400000    # 3min runs measured 230-360K input; 400K = 1.1x headroom
  token_budget_output: 30000    # 3min runs measured 16-25K output

scenarios:
  S1:
    target_image: openclaw/ctf-target:v1
    oracle_image: openclaw/oracle-s1:v1
    flag_slot_count: 4

models:
  - id: deepseek_paid
    openrouter_slug: deepseek/deepseek-v4-flash
    label: DeepSeek-V4-Flash (paid)
  - id: qwen_coder_paid
    openrouter_slug: qwen/qwen3-coder
    label: Qwen3-Coder (paid)

phases:
  - name: A1
    description: Phase A stage 1 — k=1 on S1, paid endpoints
    grid:
      models: [deepseek_paid, qwen_coder_paid]
      scenarios: [S1]
      modes: [defense_only, attack_only]
      k: 1
