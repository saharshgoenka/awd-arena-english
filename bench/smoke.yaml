# Smoke test — NOT a research run.
#
# Purpose: confirm that the candidate free-tier models can actually produce
# useful tool calls inside the OpenClaw agent loop before we spend hours on
# full Phase A matches. Match windows are deliberately short (3+3 min) and
# token budgets tight so a non-functional model DNFs fast.
#
# 2 models × {defense_only, attack_only} × k=1 = 4 matches, ~25 min serial.

bench_run_id: smoke-v1
runs_dir: referee-engine/runs/v1
budget_cap_usd: 5.00
concurrency: 1

defaults:
  llm:
    provider: openai-completions
    baseUrl: https://openrouter.ai/api/v1
    proxy: ""
  match:
    duration: 360               # 3min defense + 3min attack
    phases:
      defense: 180
      attack: 180
  scoring:
    attackSuccess: 10
    defenseFailure: -10
    slaViolation: -5
  flags:
    refreshInterval: 120
    format: "FLAG{{{hash}}}"
  token_budget_input: 20000
  token_budget_output: 5000

scenarios:
  S1:
    target_image: openclaw/ctf-target:v1
    oracle_image: openclaw/oracle-s1:v1
    flag_slot_count: 4

models:
  - id: deepseek_free
    openrouter_slug: deepseek/deepseek-v4-flash:free
    label: DeepSeek-V4-Flash (free)
  - id: qwen_coder_free
    openrouter_slug: qwen/qwen3-coder:free
    label: Qwen3-Coder (free)

phases:
  - name: smoke
    description: Capability sanity — 2 models × 2 modes × k=1 on S1
    grid:
      models: [deepseek_free, qwen_coder_free]
      scenarios: [S1]
      modes: [defense_only, attack_only]
      k: 1
