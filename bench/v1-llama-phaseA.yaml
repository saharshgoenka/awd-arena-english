# Llama-3.3-70B Phase A on S1 — rounds out the original §4.3 3-model plan.
# 4 matches: 1 model × 2 modes × k=2 (matches the §7.5 Phase A grid for the
# two models already run).
#
# Paid slug used for the same reason as the DeepSeek/Qwen runs — :free
# variants rate-limit mid-match. Paid Llama-3.3-70B is $0.10/M in, $0.32/M out
# (verified 2026-05-22), comparable to or cheaper than DeepSeek-V4-Flash.
# Expected per-match spend: $0.02-0.15. Total: ~$0.10-0.60.

bench_run_id: v1-phaseA-llama
runs_dir: referee-engine/runs/v1
budget_cap_usd: 1.00
concurrency: 1

defaults:
  llm:
    provider: openai-completions
    baseUrl: https://openrouter.ai/api/v1
    proxy: ""
  match:
    duration: 360
    phases:
      defense: 180
      attack: 180
  scoring:
    attackSuccess: 10
    defenseFailure: -10
    slaViolation: -5
  flags:
    refreshInterval: 300
    format: "FLAG{{{hash}}}"
  token_budget_input: 800000
  token_budget_output: 60000

scenarios:
  S1:
    target_image: openclaw/ctf-target:v1
    oracle_image: openclaw/oracle-s1:v1
    flag_slot_count: 4

models:
  - id: llama_70b_paid
    openrouter_slug: meta-llama/llama-3.3-70b-instruct
    label: Llama-3.3-70B-Instruct (paid)

phases:
  - name: llama-phaseA
    description: Phase A k=2 grid for Llama-3.3-70B on S1
    grid:
      models: [llama_70b_paid]
      scenarios: [S1]
      modes: [defense_only, attack_only]
      k: 2
