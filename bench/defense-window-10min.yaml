# 10-minute defense window smoke test.
#
# Followup to defense-window-15min.yaml (which confirmed DeepSeek defends 4/4
# in 15 min for $0.087). Question: is 10 min enough? The 15-min run showed the
# agent landed all 4 patches in a single multi-turn init turn — if it can do
# the same in 10 min, Phase B's defense window can be tightened to save ~33%
# wall clock per match.
#
# Pass criterion: core_code/changed > 0 AND oracle captures fewer flags
# than the 4/4 baseline. Ideal: 0/4 like the 15-min run.

bench_run_id: defense-window-10min-v1
runs_dir: referee-engine/runs/v1
budget_cap_usd: 1.00
concurrency: 1

defaults:
  llm:
    provider: openai-completions
    baseUrl: https://openrouter.ai/api/v1
    proxy: ""
  match:
    duration: 780             # 10min defense + 3min attack
    phases:
      defense: 600
      attack: 180
  scoring:
    attackSuccess: 10
    defenseFailure: -10
    slaViolation: -5
  flags:
    refreshInterval: 300
    format: "FLAG{{{hash}}}"
  token_budget_input: 2000000
  token_budget_output: 200000

scenarios:
  S1:
    target_image: openclaw/ctf-target:v1
    oracle_image: openclaw/oracle-s1:v1
    flag_slot_count: 4

models:
  - id: deepseek_paid
    openrouter_slug: deepseek/deepseek-v4-flash
    label: DeepSeek-V4-Flash (paid)

phases:
  - name: defense-10min
    description: One def-only match with 10-min defense window
    grid:
      models: [deepseek_paid]
      scenarios: [S1]
      modes: [defense_only]
      k: 1
