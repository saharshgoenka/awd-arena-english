# 10-minute defense window smoke for Qwen3-235B-A22B.
#
# Companion to defense-window-10min-v1: confirmed DeepSeek defends 4/4 in
# 10 min for $0.044. Qwen is the slower-and-pricier model in our set, so this
# tests whether 10 min holds as a viable Phase B default across model families
# or whether the weaker models need more time. If Qwen falls short, the default
# should rise to whatever the weakest leaderboard model actually needs.

bench_run_id: defense-window-10min-qwen-v1
runs_dir: referee-engine/runs/v1
budget_cap_usd: 1.00
concurrency: 1

defaults:
  llm:
    provider: openai-completions
    baseUrl: https://openrouter.ai/api/v1
    proxy: ""
  match:
    duration: 780
    phases:
      defense: 600
      attack: 180
  scoring:
    attackSuccess: 10
    defenseFailure: -10
    slaViolation: -5
  flags:
    refreshInterval: 300
    format: "FLAG{{{hash}}}"
  token_budget_input: 2000000
  token_budget_output: 200000

scenarios:
  S1:
    target_image: openclaw/ctf-target:v1
    oracle_image: openclaw/oracle-s1:v1
    flag_slot_count: 4

models:
  - id: qwen_a22b_paid
    openrouter_slug: qwen/qwen3-235b-a22b-2507
    label: Qwen3-235B-A22B (paid)

phases:
  - name: defense-10min-qwen
    description: One Qwen def-only match with 10-min defense window
    grid:
      models: [qwen_a22b_paid]
      scenarios: [S1]
      modes: [defense_only]
      k: 1
