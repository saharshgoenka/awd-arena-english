# Single-match cost probe — calibrate real $/match before launching Phase A.
#
# Goal: measure exact OpenRouter cost for a 3-min DeepSeek defense_only match
# on S1, with the agent_client camelCase usage fix applied. After the match
# completes, read OpenRouter /auth/key endpoint for the delta and decide
# whether full Phase A (8 matches × 5+5min) is safe on the remaining ~$1 budget.
#
# Worst-case spend on this probe: ~$0.10 (3-min match, DeepSeek paid).

bench_run_id: cost-probe-v1
runs_dir: referee-engine/runs/v1
budget_cap_usd: 5.00
concurrency: 1

defaults:
  llm:
    provider: openai-completions
    baseUrl: https://openrouter.ai/api/v1
    proxy: ""
  match:
    duration: 360
    phases:
      defense: 180
      attack: 180
  scoring:
    attackSuccess: 10
    defenseFailure: -10
    slaViolation: -5
  flags:
    refreshInterval: 120
    format: "FLAG{{{hash}}}"
  token_budget_input: 500000
  token_budget_output: 50000

scenarios:
  S1:
    target_image: openclaw/ctf-target:v1
    oracle_image: openclaw/oracle-s1:v1
    flag_slot_count: 4

models:
  - id: deepseek_paid
    openrouter_slug: deepseek/deepseek-v4-flash
    label: DeepSeek-V4-Flash (paid)

phases:
  - name: probe
    description: One DeepSeek def-only match for cost calibration
    grid:
      models: [deepseek_paid]
      scenarios: [S1]
      modes: [defense_only]
      k: 1
