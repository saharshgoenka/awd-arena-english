flags:
  - id: flag_1
    env: FLAG_1
    owasp: A01
    category: broken_access_control
    hint: "Report object reads must verify the authenticated user owns the requested report."
  - id: flag_2
    env: FLAG_2
    owasp: A05
    category: security_misconfiguration
    hint: "Unadvertised diagnostics endpoints must not expose operational secrets such as sync tokens."
  - id: flag_3
    env: FLAG_3
    owasp: A02
    category: cryptographic_failures
    hint: "Encrypted exports must use a unique nonce or IV so known plaintext cannot recover another item's keystream."
  - id: flag_4
    env: FLAG_4
    owasp: A03
    category: injection
    hint: "String concatenation into a SQL query is SQLi. Use a bound ? placeholder."
  - id: flag_5
    env: FLAG_5
    owasp: A07
    category: authentication_failures
    hint: "Token verification must reject alg:none and require a valid signature."
