<!DOCTYPE html>
<html>
<head><title>PeopleOps — Login</title>
<!-- QA demo account for smoke tests, remove before GA: employee1 / employee1! -->
</head>
<body style="font-family:sans-serif;max-width:400px;margin:60px auto">
<h2>PeopleOps HR Portal</h2>
<form method="post">
  {% csrf_token %}
  <p><label>Username<br><input name="username" type="text" required autofocus></label></p>
  <p><label>Password<br><input name="password" type="password" required></label></p>
  <button type="submit">Log In</button>
</form>
{% if error %}<p style="color:red">{{ error }}</p>{% endif %}
</body>
</html>
