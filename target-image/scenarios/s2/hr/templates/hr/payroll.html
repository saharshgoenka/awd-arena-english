<!DOCTYPE html>
<html>
<head><title>PeopleOps — Payroll</title></head>
<body style="font-family:sans-serif;max-width:900px;margin:40px auto">
<h2>Payroll — {{ request.user.username }}</h2>
<p>Payroll authorization token: <code>{{ flag }}</code></p>
<table border="1" cellpadding="6" style="width:100%">
<tr><th>Emp ID</th><th>Username</th><th>Department</th><th>Salary</th></tr>
{% for emp in employees %}
<tr>
  <td>{{ emp.employee_id }}</td>
  <td>{{ emp.user.username }}</td>
  <td>{{ emp.department }}</td>
  <td>${{ emp.salary }}</td>
</tr>
{% endfor %}
</table>
<p><a href="/dashboard/">Back to Dashboard</a></p>
</body>
</html>
