<!DOCTYPE html>
<html>
<head><title>PeopleOps — Search</title></head>
<body style="font-family:sans-serif;max-width:900px;margin:40px auto">
<h2>Employee Search</h2>
<form method="get">
  <input name="q" value="{{ q }}" placeholder="Search by username..." style="width:300px">
  <button type="submit">Search</button>
</form>
{% if results %}
<table border="1" cellpadding="6" style="margin-top:16px;width:100%">
<tr><th>Emp ID</th><th>Username</th><th>Department</th><th>Salary</th></tr>
{% for emp in results %}
<tr>
  <td>{{ emp.employee_id }}</td>
  <td>{% if emp.username %}{{ emp.username }}{% else %}{{ emp.user.username }}{% endif %}</td>
  <td>{{ emp.department }}</td>
  <td>{{ emp.salary }}</td>
</tr>
{% endfor %}
</table>
{% endif %}
<p><a href="/dashboard/">Back to Dashboard</a></p>
</body>
</html>
