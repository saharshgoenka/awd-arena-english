server.port=3000

# SQLite datasource
spring.datasource.url=jdbc:sqlite:/app/data/finledger.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# Run data.sql after JPA DDL
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Spring Actuator — flag_2: over-exposed with no auth
management.endpoints.web.exposure.include=health,info,env,metrics
management.endpoint.env.enabled=true
management.endpoint.env.show-values=ALWAYS
management.endpoints.web.base-path=/actuator

# Silence the default security auto-config password log
spring.security.user.password=disabled
logging.level.org.springframework.security=WARN
