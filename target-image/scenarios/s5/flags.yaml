  - id: flag_3
    env: FLAG_3
    owasp: A02
    category: cryptographic_failures
    hint: "Encrypted ledger exports reuse one keystream; a known plaintext entry can recover the vault."
  - id: flag_4
    env: FLAG_4
    owasp: A03
    category: injection
    hint: "JdbcTemplate string concatenation is SQL injection — parameterized queries fix it."
  - id: flag_5
    env: FLAG_5
    owasp: A07
    category: authentication_failures
    hint: "The staff token verifier accepts alg:none, so unsigned role claims may be trusted."
