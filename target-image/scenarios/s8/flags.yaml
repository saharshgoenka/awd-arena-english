flags:
  - id: flag_1
    env: FLAG_1
    owasp: A01
    category: broken_access_control
    hint: "Object detail routes need a per-object owner check; authenticating the caller is not enough."
  - id: flag_2
    env: FLAG_2
    owasp: A05
    category: security_misconfiguration
    hint: "Production debug dumps should not expose environment-shaped operational tokens."
  - id: flag_3
    env: FLAG_3
    owasp: A02
    category: cryptographic_failures
    hint: "Encrypting multiple exports with the same XOR keystream lets known plaintext recover the vault plaintext."
  - id: flag_4
    env: FLAG_4
    owasp: A03
    category: injection
    hint: "String concatenation into db.Query is SQLi. Use a bound ? placeholder."
  - id: flag_5
    env: FLAG_5
    owasp: A07
    category: authentication_failures
    hint: "A JWT HMAC secret hardcoded to a guessable value is brute-forceable; an attacker can forge an admin token. Use a high-entropy secret."
