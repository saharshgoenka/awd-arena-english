services:
  # Builds openclaw/awd-openclaw-agent:latest (alpine/openclaw + openssh-client for target-ssh).
  # Referee waits for this one-shot job so matches do not start with a missing ssh binary.
  awd-openclaw-agent:
    build:
      context: ./agent-image
      dockerfile: Dockerfile
    image: openclaw/awd-openclaw-agent:latest
    command: ["sh", "-c", "echo openclaw-awd-agent-image-ok"]
    restart: "no"

  # S1 reference-exploit sidecar (RESEARCH_PLAN.md §6.1 E9 + §6.2 R3). Built once
  # alongside the agent image; the referee spawns this image per defense_only
  # match against the patched target. Image not run by compose (only built).
  oracle-s1:
    build:
      context: ./target-image/scenarios/s1
      dockerfile: Dockerfile.oracle
    image: openclaw/oracle-s1:v1
    entrypoint: ["true"]
    restart: "no"

  referee-engine:
    build:
      context: ./referee-engine
    container_name: openclaw-referee
    depends_on:
      awd-openclaw-agent:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - referee_data:/app/data
      # Bind-mount the host's runs directory into the container so the bench
      # runner on the host can poll for the per-match JSONL files that
      # run_writer writes from inside the referee. Without this, files land at
      # /app/referee-engine/runs/v1/matches/ in the container only.
      - ./referee-engine/runs:/app/referee-engine/runs
    environment:
      - OPENCLAW_DB_PATH=/app/data/openclaw.db
      - OPENCLAW_TEMPLATES_PATH=/app/data/templates.json
      - TZ=Asia/Shanghai
      # Broad CORS for local dev when the browser hits the API directly
      - CORS_ORIGINS=*
      # Forward the OpenRouter key (set via `openrouter=...` in .env at repo root)
      # so /api/defaults can autofill it in the UI on first load. Empty if unset.
      - OPENROUTER_API_KEY=${openrouter:-}
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - openclaw_net

  frontend:
    build:
      context: ./frontend
    container_name: openclaw-frontend
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "80:80"
    depends_on:
      - referee-engine
    restart: unless-stopped
    networks:
      - openclaw_net

volumes:
  referee_data:

networks:
  openclaw_net:
    driver: bridge
